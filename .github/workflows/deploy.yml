name: Deploy to GitHub Pages

on:
  push:
    branches:
      - landing-page

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY != '' && vars.PUBLIC_WEB3FORMS_KEY || secrets.PUBLIC_WEB3FORMS_KEY }}
    defaults:
      run:
        working-directory: discografica-romana
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate required public env
        run: |
          if [ -z "$PUBLIC_WEB3FORMS_KEY" ]; then
            echo "PUBLIC_WEB3FORMS_KEY mancante: imposta una Repository Variable o Secret in Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Build site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./discografica-romana/build
          publish_branch: gh-pages
